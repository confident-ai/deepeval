name: Ts Confident Tests

on:
  pull_request:
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript_confident.yml'
  push:
    branches:
      - main
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript_confident.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:22
    defaults:
      run:
        working-directory: typescript
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CONFIDENT_API_KEY: ${{ secrets.CONFIDENT_API_KEY }}
      CONFIDENT_TRACE_VERBOSE: 0
    steps:
      - uses: actions/checkout@v3
      - run: npm ci
      # Only run when a Confident API key is available (e.g. not on fork PRs).
      - name: Run Confident AI tests
        if: ${{ env.CONFIDENT_API_KEY != '' }}
        run: npx jest -c jest.confident.config.js
