name: Agent Skills Index Check

# The site publishes copies of `skills/` under
# `docs/public/.well-known/agent-skills/`, and Vercel builds `docs/` with a
# root directory that hides `../skills`, so the generator no-ops there and the
# committed copies are what production serves. Without this job, editing a
# skill without rebuilding the copies would strand the published SKILL.md and
# its sha256 digest silently.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'docs/public/.well-known/agent-skills/**'
      - 'docs/scripts/generate-agent-skills.mjs'
      - '.github/workflows/agent_skills_check.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'docs/public/.well-known/agent-skills/**'
      - 'docs/scripts/generate-agent-skills.mjs'
      - '.github/workflows/agent_skills_check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate the published skills
        run: node docs/scripts/generate-agent-skills.mjs

      - name: Fail if the committed copies are stale
        run: |
          # Without this guard a non-repo checkout would make `git diff` error
          # out to stderr and print nothing, which the comparison below would
          # read as "no drift" and pass.
          git rev-parse --is-inside-work-tree > /dev/null 2>&1 || {
            echo "::error::not a git work tree, cannot compare against the committed copies"
            exit 1
          }
          if ! git diff --exit-code -- docs/public/.well-known/agent-skills; then
            echo "::error::docs/public/.well-known/agent-skills is out of date. Run 'node docs/scripts/generate-agent-skills.mjs' from the repo root and commit the result."
            exit 1
          fi
